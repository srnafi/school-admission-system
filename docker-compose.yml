services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: admission
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d admission"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: Host=db;Database=admission;Username=app;Password=app
      HOLD_DURATION_SECONDS: "600"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
