services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: admission
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d admission"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: Host=db;Database=admission;Username=app;Password=app
      HOLD_DURATION_SECONDS: "600"
    depends_on:
      db:
        condition: service_healthy

  backend2:
    profiles: ["bonus"]
    build: ./backend
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__Default: Host=db;Database=admission;Username=app;Password=app
      HOLD_DURATION_SECONDS: "600"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      API_URL: http://localhost:8080
    depends_on:
      - backend

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      TEST_CONNECTION: Host=db;Database=admission_test;Username=app;Password=app
    depends_on:
      db:
        condition: service_healthy

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.test

volumes:
  pgdata:
